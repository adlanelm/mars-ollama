  # Test only, not for clients: plain long-lived docling-serve for bench/docling-leak.sh. On 1.37 it keeps ~2.2 GiB VRAM and ratchets RAM
  # per large PDF, so docling-proxy stays (bench/docling-2026-10-16.md). Re-run on a new release: `docker compose --profile docling-plain up -d docling`.
  docling:
    profiles: ["docling-plain"]
    image: ghcr.io/docling-project/docling-serve-rocm:main
    container_name: docling
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      UVICORN_WORKERS: "1"
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
      DOCLING_SERVE_MAX_SYNC_WAIT: "36000"
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "864000"
      DOCLING_SERVE_MAX_FILE_SIZE: "1073741824"
      DOCLING_SERVE_ALLOW_CUSTOM_CODE_FORMULA_CONFIG: "true"
      DOCLING_SERVE_ALLOW_CUSTOM_VLM_CONFIG: "true"
      DOCLING_SERVE_ALLOW_CUSTOM_PICTURE_DESCRIPTION_CONFIG: "true"
      DOCLING_SERVE_SCRATCH_PATH: /tmp/docling-serve
      DOCLING_SERVE_OPTIONS_CACHE_SIZE: "1"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_ENABLE_MANAGEMENT_ENDPOINTS: "true"
      GPU_MAX_HEAP_SIZE: 80
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: 1
      DOCLING_SERVE_OCR_BATCH_SIZE: 4
      DOCLING_SERVE_LAYOUT_BATCH_SIZE: 4
      DOCLING_SERVE_TABLE_BATCH_SIZE: 4
      DOCLING_PERF_PAGE_BATCH_SIZE: 4
      DOCLING_NUM_THREADS: 16
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    privileged: true
    security_opt:
      - seccomp:unconfined
    networks:
      - ollama
    restart: "no"

  docling-proxy:
    build:
      context: ./docling-proxy
      dockerfile: Dockerfile.docling-proxy
    container_name: docling-proxy
    ports:
      - "8000:8080"
    environment:
      DOCLING_PROXY_MAX_PAGES_PER_PART: 50
      DOCLING_PROXY_WORK_CONCURRENCY: 16
      DOCLING_PROXY_ACTIVE_CHILD_LIMIT: 1
      DOCLING_PROXY_CHILD_LAUNCH_CONCURRENCY: 1
      DOCLING_PROXY_UVICORN_WORKERS: 1
      DOCLING_PROXY_WARM_CHILD_POOL_SIZE: 1
      DOCLING_PROXY_WARM_CHILD_IDLE_TIMEOUT_SEC: 30
      DOCLING_PROXY_WARM_CHILD_REAP_INTERVAL_SEC: 5
      DOCLING_PROXY_POLL_INTERVAL_SEC: 2
      DOCLING_PROXY_ARCHIVE_DIR: /var/lib/docling-output
      DOCLING_PROXY_MD_TABLE_MAX_CHARS: 1500 # split longer md tables at row boundaries, header repeated, so Open WebUI's 1800-char chunks never cut a table mid-row
      DOCLING_PROXY_CHILD_STARTUP_TIMEOUT_SEC: 120
      DOCLING_PROXY_CHILD_REQUEST_TIMEOUT_SEC: 36000
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "true"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
      DOCLING_SERVE_MAX_SYNC_WAIT: "36000"
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "864000"
      DOCLING_SERVE_MAX_FILE_SIZE: "1073741824"
      DOCLING_SERVE_LOG_LEVEL: DEBUG
      DOCLING_SERVE_ALLOW_CUSTOM_CODE_FORMULA_CONFIG: "true"
      DOCLING_SERVE_ALLOW_CUSTOM_VLM_CONFIG: "true"
      DOCLING_SERVE_ALLOW_CUSTOM_PICTURE_DESCRIPTION_CONFIG: "true"
      # Server-side picture description: clients only send do_picture_description=true. Granite Vision 4.1 via llama-swap
      # (chat group, so it swaps the chat model out); descriptions beat 3.3 on charts and tables (bench/docling-2026-10-16.md)
      DOCLING_SERVE_CUSTOM_PICTURE_DESCRIPTION_PRESETS: >-
        {"granite-vision-4.1": {"engine_options": {"engine_type": "api", "url": "http://ollama:11434/v1/chat/completions",
        "headers": {}, "params": {"model": "granite-vision-4.1", "max_tokens": 300}, "timeout": 180, "concurrency": 4},
        "model_spec": {"name": "granite-vision-4.1", "default_repo_id": "ibm-granite/granite-vision-4.1-4b",
        "prompt": "Describe this image", "response_format": "plaintext"},
        "prompt": "Describe this image in 2-4 sentences for search: what kind of image it is, its title and labels, and the key values or takeaways.",
        "picture_area_threshold": 0.05}}
      DOCLING_SERVE_DEFAULT_PICTURE_DESCRIPTION_PRESET: granite-vision-4.1
      DOCLING_SERVE_SCRATCH_PATH: /tmp/docling-serve
      GPU_MAX_HEAP_SIZE: 80
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: 1
      DOCLING_SERVE_OCR_BATCH_SIZE: 4
      DOCLING_SERVE_LAYOUT_BATCH_SIZE: 4
      DOCLING_SERVE_TABLE_BATCH_SIZE: 4
      DOCLING_PERF_PAGE_BATCH_SIZE: 4
      DOCLING_DEBUG_PROFILE_PIPELINE_TIMINGS: "true"
      DOCLING_NUM_THREADS: 16
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: 2
      DOCLING_SERVE_ENABLE_MANAGEMENT_ENDPOINTS: "false"
      DOCLING_SERVE_ARTIFACTS_PATH:
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    volumes:
      - ${HOME}/llm/docling:/var/lib/docling-output:Z,U
    restart: always
    privileged: true
    security_opt:
      - seccomp:unconfined
    networks:
      - ollama

networks:
  ollama:

volumes:
  hf-hub-cache:
