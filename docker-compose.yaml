services:
  # ─────────────────────────────────────────────────────────────
  # OLLAMA
  # ─────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama
    profiles: ["legacy"] # replaced by llama-swap; kept for rollback (ROADMAP Phase 4/5)
    pull_policy: always
    mem_limit: 28g
    cpus: "12.8" # 80% of 16 logical CPUs; models set PARAMETER num_thread 13
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_VULKAN=1
      #- HSA_OVERRIDE_GFX_VERSION=10.3.0
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - ROCR_VISIBLE_DEVICES=0
      - HIP_VISIBLE_DEVICES=0
      - OLLAMA_DEBUG=0
      - OLLAMA_NEW_ENGINE=True
      - OLLAMA_NEW_ESTIMATES=True
      - OLLAMA_KEEP_ALIVE=35
      - OLLAMA_ORIGINS="moz-extension://*"
    ports:
      - "11434:11434" # Ollama API at http://localhost:11434
    volumes:
      - $HOME/llm/ollama/data:/root/.ollama:Z,U
    networks:
      - ollama
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    restart: always
    privileged: true
    security_opt:
      - seccomp:unconfined

  # ─────────────────────────────────────────────────────────────
  # LLAMA-SWAP + llama.cpp (Vulkan) — replaces ollama, see ROADMAP.md
  # ─────────────────────────────────────────────────────────────
  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:v263-vulkan-b11541
    container_name: llama-swap
    entrypoint: ["/app/llama-swap", "-config", "/config/config.yaml", "-listen", ":11434"] # no -watch-config: a reload restarts models mid-request (502s); apply edits with `docker compose restart llama-swap`
    mem_limit: 28g
    cpus: "12.8"
    environment:
      - GGML_VK_VISIBLE_DEVICES=0 # Vulkan0 = RX 7800 XT; Vulkan1 is the 610M iGPU
      - LLAMA_CACHE=/cache        # only used by `-hf` experiments
    ports:
      - "11434:11434" # same host and in-network port as Ollama had, so clients keep their URL
    volumes:
      - $HOME/llm/models:/models:ro,Z
      - $HOME/llm/llama-cache:/cache:Z
      - ./llama-swap:/config:ro,Z # a directory, not the file: editors replace the inode, a file mount would go stale
      - $HOME/llm/colibri/bin:/colibri:ro,Z # colibri v2.0.0 tree + qwen38 engine (VK=1) + shaders
      - $HOME/llm/colibri/models:/colibri-models:Z # read-write: colibri writes .coli_kv/.coli_usage/.coli_ssd here
    networks:
      ollama:
        aliases:
          - ollama # docling-proxy and other in-network clients keep resolving http://ollama:11434
    devices:
      - /dev/dri:/dev/dri
      - /dev/kfd:/dev/kfd
    group_add:
      - "983" # video (host gid; names don't exist in the image)
      - "987" # render
    healthcheck: # the image probes :8080, but llama-swap listens on :11434 here
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/health || exit 1"]
      interval: 30s
      timeout: 5s
    restart: always

  # ─────────────────────────────────────────────────────────────
  # COMFYUI (ROCm) — started by `bin/gpu-mode comfy`, see ROADMAP Phase 6; GPU arbitration with llama-swap: docs/gpu-switching.md
  # ─────────────────────────────────────────────────────────────
  comfyui:
    profiles: ["comfy"]
    build: ./comfyui
    image: comfyui-rocm:0.39.2
    container_name: comfyui
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "983" # video
      - "987" # render
    ipc: host
    security_opt:
      - seccomp=unconfined
    ports:
      - "127.0.0.1:8188:8188"
    volumes:
      - ${HOME}/llm/comfyui/models:/opt/ComfyUI/models
      - ${HOME}/llm/comfyui/output:/opt/ComfyUI/output
      - ${HOME}/llm/comfyui/user:/opt/ComfyUI/user
      - ./comfyui/gpu_arbiter:/opt/ComfyUI/custom_nodes/gpu_arbiter:ro # unloads llama-swap's GPU model before a prompt runs (docs/gpu-switching.md)
    environment:
      - GPU_ARBITER_LLM_URL=http://llama-swap:11434
    networks:
      - ollama # reaches llama-swap; llama-swap's gpu-guard reaches http://comfyui:8188
    restart: "no" # gpu-mode starts and stops it

  # TRELLIS.2 image -> vertex-coloured .glb, licence-clean (docs/trellis.md, docs/licenses.md). Separate image/tag so the Krita ComfyUI stays untouched.
  # Start: `docker compose --profile trellis up -d comfyui-trellis`. The hand-over with llama-swap is automatic (docs/gpu-switching.md),
  # not with the Krita `comfyui`: free or stop that one first (`bin/gpu-mode llm --stop`).
  comfyui-trellis:
    profiles: ["trellis"]
    build: ./trellis
    image: comfyui-trellis2-rocm:0.39.2-b3b9e95-clean
    container_name: comfyui-trellis
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - "983" # video
      - "987" # render
    ipc: host
    security_opt:
      - seccomp=unconfined
    ports:
      - "127.0.0.1:8189:8188"
    volumes:
      - ${HOME}/llm/trellis/models/Trellis2:/opt/ComfyUI/models/Trellis2
      - ${HOME}/llm/trellis/in:/opt/ComfyUI/input
      - ${HOME}/llm/trellis/out:/opt/ComfyUI/output
      - ${HOME}/llm/trellis/user:/opt/ComfyUI/user
      - ${HOME}/llm/trellis/cache:/cache # u2net (rembg), Triton JIT cache, HF cache
      - ./comfyui/gpu_arbiter:/opt/ComfyUI/custom_nodes/gpu_arbiter:ro # same arbiter as comfyui (not baked in: the image stays as licence-checked)
    environment:
      - GPU_ARBITER_LLM_URL=http://llama-swap:11434
    networks:
      - ollama # gpu-guard reaches http://comfyui-trellis:8188
    restart: "no"

