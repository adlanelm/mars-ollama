# NOT APPLIED. Merge by hand into llama-swap/config.yaml, then `docker compose restart llama-swap`.
# Prerequisites: docs/colibri-compose.patch.md (two new volumes) and the model download in ~/llm/colibri/models.
# Spec and flag provenance: docs/colibri.md. Built from colibri v2.0.0 with `make qwen38 VK=1` in the llama-swap image.
#
# 1. Add the model under `models:`.
# 2. Add `colibri-big` to `routing.router.settings.groups.chat.members`.
# 3. Raise the top-level `healthCheckTimeout` (currently 600) to about 3600: a cold start reads tens of GB from NVMe.
#    As far as I know v263 has no per-model health timeout [verify].

models:
  # ── Slow big-MoE tier (Qwen3.8-Flash-Next FP8, 186 GB on NVMe). Batch/overnight only, ~2-4 tok/s. ──
  # Close Unity, Blender and ComfyUI first. Aux models (~3.1 GiB RAM) stay resident.
  "colibri-big":
    name: "Qwen3.8 Flash-Next (colibri, slow, NVMe-streamed)"
    aliases: ["qwen3.8-flash-next"]
    ttl: 600 # unload 10 min after the last request, freeing ~18 GiB RAM
    # coli is a Python launcher (python3 3.14 exists in the image) that spawns /colibri/c/qwen38 (the C engine).
    # It does not hit the network. --ram is the expert-cache budget in GiB (sets RAM_GB), --cap the cache slots per layer.
    cmd: |
      python3 /colibri/c/coli serve
      --model /colibri-models/qwen38-flash-next
      --host 127.0.0.1 --port ${PORT}
      --model-id colibri-big
      --ram 18 --cap 25 --ctx 8192 --kv-slots 1
      --max-queue 2 --queue-timeout 3600
    # No cmdStop: llama-swap v263 only documents ${PID} for cmdStop; its default SIGTERM is handled by
    # coli serve (stops the engine child). Give the engine time to exit cleanly before a forced kill.
    unloadTimeout: 30
    checkEndpoint: /health # public (no API key needed); returns {"status":"ok"} once the HTTP server is up
    env:
      - COLI_VULKAN=1 # engine was built with VK=1; this switches the GPU on at runtime
      - COLI_VK_DEV=0 # Vulkan0 = RX 7800 XT (Vulkan1 is the 610M iGPU)
      - COLI_NO_OMP_TUNE=1 # recommended on multi-core hosts
      - RAM_GB=18 # same as --ram; leaves headroom under the 28g container limit + aux models
      - CAP=25 # coli plan: 18 GB budget -> cap 25/layer (5.8 dense + 5.9 runtime + 6.2 warm experts)
      - RSS_GUARD_GB=22 # trims the cache if RSS crosses this (default = RAM budget)
      - PYTHONDONTWRITEBYTECODE=1 # /colibri is mounted read-only
      # The model mount is read-write because colibri writes .coli_kv / .coli_usage / .coli_ssd into the model dir.
      # To mount it read-only instead, uncomment these (loses warm KV reopen and usage-based pinning):
      # - KVSAVE=0
      # - USAGE_SAVE=0

# routing.router.settings.groups.chat.members gets one more entry:
#   - colibri-big
