# llama-swap config (image ghcr.io/mostlygeek/llama-swap:v263-vulkan-b11541).
# Schema: https://github.com/mostlygeek/llama-swap/blob/v263/docs/config.example.yaml
# Rationale for quants and flags: docs/models.md. Files come from bin/llm-pull (llama-swap/models.lock.yaml).

healthCheckTimeout: 1230 # gpu-guard wait for ComfyUI (max 600) + cold load of a 20 GB model from disk (600) + /free
logLevel: info
logToStdout: "proxy,upstream,http" # upstream = llama-server logs (fit/offload decisions); http = access log
startPort: 10001
sendLoadingState: false # would inject loading text into reasoning_content (docling, scripts)
includeAliasesInList: false

macros:
  # GPU models start through gpu-guard: it waits for ComfyUI jobs to finish and frees ComfyUI's VRAM first
  # (docs/gpu-switching.md). ComfyUI's gpu_arbiter node finds the models to unload by this name in their cmd.
  gpu_guard: /config/gpu-guard
  # Shared by the big chat models. --fit (default on, 1 GiB margin) picks -ngl / expert split.
  # --kv-unified: with an explicit -np, slots otherwise get c/np each (48k -> 2x24k).
  # -lm dio (direct I/O, no mmap): CPU-side weights stay resident; with mmap, page-cache eviction after a
  # model swap made qwen3.6 re-read experts from NVMe mid-inference (3.8 tok/s prompt instead of 700+).
  # --reasoning-budget-message: pi sends thinking_budget_tokens per thinking level (pi/models.json); when a budget
  # runs out the server closes the reasoning, and this line makes the model act instead of trailing off.
  chat_common: >-
    -fa on -ctk q8_0 -ctv q8_0 -np 2 --kv-unified -ctxcp 8 -cram 2048 -lm dio --jinja --no-webui
    --reasoning-budget-message "Thinking budget reached. Act now with what I have."
  # MoE models: physical cores (6-12 threads measured equal); ub 2048 = +40% prompt speed (bench/qwen3.6-sweep.md)
  moe_common: >-
    -t 8 -tb 8 -ub 2048 -b 2048
  # CPU-resident embedders; -t 8: bulk indexing (document upload) is CPU-bound and rarely overlaps generation
  aux_common: >-
    -dev none -ngl 0 -c 8192 -b 8192 -ub 8192 -t 8 -cram 0 --no-webui

models:
  # ── Chat group (GPU, one at a time) ────────────────────────────
  # Dense 27B: must stay 100% on GPU. 48k context with vision (encoder on CPU).
  "qwen3.8-27b":
    name: "Qwen3.8 27B (dense, 48k, vision)"
    aliases: ["qwen3.8:latest", "qwen3.8", "qwen3.8:64k", "qwen3.8:128k"]
    ttl: 900
    cmd: |
      ${gpu_guard} llama-server --port ${PORT}
      -m /models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q3_K_XL.gguf
      --mmproj /models/unsloth/Qwen3.8-27B-GGUF/mmproj-F16.gguf
      ${chat_common}
      -c 49152 --no-mmproj-offload -ub 256
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 0

  # MoE 35B / 3B active. No -ngl / --n-cpu-moe: --fit picks the expert split at load time.
  "qwen3.6-35b-a3b":
    name: "Qwen3.6 35B-A3B (MoE, 128k, vision)"
    aliases: ["qwen3.6"]
    ttl: 900
    cmd: |
      ${gpu_guard} llama-server --port ${PORT}
      -m /models/unsloth/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      --mmproj /models/unsloth/Qwen3.6-35B-A3B-GGUF/mmproj-F16.gguf
      ${chat_common} ${moe_common}
      -c 131072
      --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0 --presence-penalty 1.5

  # MoE 25.2B / 3.8B active, QAT-based quant. Keep --swa-full off.
  # MTP draft (2026-10-13, bench/verification-2026-10-13.md): +20-75% tg. --fit does not count the draft
  # (+0.2-1.0 GiB), hence the 2 GiB margin; 1.5 GiB showed VRAM eviction.
  "gemma4-26b":
    name: "Gemma 4 26B-A4B QAT (MoE, 128k, vision)"
    aliases: ["gemma4:26b", "gemma4:26b-64k", "gemma4:26b-128k"]
    ttl: 900
    cmd: |
      ${gpu_guard} llama-server --port ${PORT}
      -m /models/unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --mmproj /models/unsloth/gemma-4-26B-A4B-it-qat-GGUF/mmproj-BF16.gguf
      ${chat_common} ${moe_common}
      -c 131072
      --temp 1.0 --top-p 0.95 --top-k 64
      --spec-type draft-mtp --spec-draft-model /models/unsloth/gemma-4-26B-A4B-it-qat-GGUF/mtp-gemma-4-26B-A4B-it.gguf
      --spec-draft-n-max 4 --fit-target 2048

  # Docling helpers: GPU, in the chat group (a docling job swaps the chat model out).
  # One granite-vision image is ~5k tokens (tiling), so the 4 slots share a unified 32k pool.
  # granite-docling needs --special: DocTags element tags (<text>, <otsl>, ...) are special tokens.
  "granite-vision":
    name: "Granite Vision 3.3 2B"
    aliases: ["ibm/granite3.3-vision:2b"]
    ttl: 120
    cmd: |
      ${gpu_guard} llama-server --port ${PORT}
      -m /models/ibm-granite/granite-vision-3.3-2b-GGUF/granite-vision-3.3-2b-Q8_0.gguf
      --mmproj /models/ibm-granite/granite-vision-3.3-2b-GGUF/mmproj-model-f16.gguf
      -fa on --jinja --no-webui -np 4 --kv-unified
      -ngl 99 -c 32768 --temp 0

  # Granite Vision 4.1 (2026): chart/table/KVP extraction, built for docling; candidate to replace 3.3 for picture description
  "granite-vision-4.1":
    name: "Granite Vision 4.1 4B"
    ttl: 120
    cmd: |
      ${gpu_guard} llama-server --port ${PORT}
      -m /models/ibm-granite/granite-vision-4.1-4b-GGUF/granite-vision-4.1-4b-Q8_0.gguf
      --mmproj /models/ibm-granite/granite-vision-4.1-4b-GGUF/mmproj-model-f16.gguf
      -fa on --jinja --no-webui -np 4 --kv-unified
      -ngl 99 -c 32768 --temp 0

  "granite-docling":
    name: "Granite Docling 258M"
    aliases: ["ibm/granite-docling:258m"]
    ttl: 120
    cmd: |
      ${gpu_guard} llama-server --port ${PORT}
      -m /models/ibm-granite/granite-docling-258M-GGUF/granite-docling-258M-BF16.gguf
      --mmproj /models/ibm-granite/granite-docling-258M-GGUF/mmproj-model-f16.gguf
      -fa on --jinja --no-webui -np 4 --kv-unified --special
      -ngl 99 -c 32768 --temp 0

  # ── Aux group (always loaded; embedders on CPU, reranker on GPU; GPU embedder on demand) ────────────────────────────
  # bge-m3 dropped 2026-10-16 (not used by Open WebUI; file and manifest entry removed 2026-10-17)
  # Qwen3-Embedding-0.6B was tested and removed: about 0.1 nDCG@10 behind snowflake on Swedish, 2.5x slower on the CPU (bench/embed-ab-2026-10-16.md)

  "snowflake-arctic-embed2":
    name: "Snowflake Arctic Embed 2 embeddings"
    aliases: ["snowflake-arctic-embed2:latest", "snowflake-arctic-embed2:latest_8192"]
    ttl: 0
    cmd: |
      llama-server --port ${PORT}
      -m /models/ollama/snowflake-arctic-embed2/snowflake-arctic-embed2-F16.gguf
      ${aux_common} --embeddings

  # Same snowflake GGUF on the GPU, for bulk re-indexing: a client switches Open WebUI's embedding model to this
  # name for the run and back afterwards. Vectors match the CPU entry (bench/compare-embeddings-gpu.py), so
  # chunks from either entry share one index. -np 4 matches Open WebUI's 4 concurrent embedding requests;
  # --kv-unified lets one 8192-token input use the whole context. Not preloaded; ttl frees the VRAM when idle.
  "snowflake-arctic-embed2-gpu":
    name: "Snowflake Arctic Embed 2 embeddings (GPU, bulk indexing)"
    ttl: 600
    cmd: |
      llama-server --port ${PORT}
      -m /models/ollama/snowflake-arctic-embed2/snowflake-arctic-embed2-F16.gguf
      -ngl 99 -c 8192 -b 8192 -ub 8192 -np 4 --kv-unified -t 4 -cram 0 --no-webui --embeddings

  # Reranker on the GPU (~370 MiB): 10 RAG chunks rerank in 0.2 s vs ~4 s on the CPU (bench/llama-swap-results.md)
  "bge-reranker-v2-m3":
    name: "BGE reranker v2 m3"
    aliases: ["linux6200/bge-reranker-v2-m3:latest"]
    ttl: 0
    cmd: |
      llama-server --port ${PORT}
      -m /models/gpustack/bge-reranker-v2-m3-GGUF/bge-reranker-v2-m3-Q8_0.gguf
      -ngl 99 -fa on -c 8192 -b 8192 -ub 2048 -t 4 -cram 0 --no-webui --reranking

  # ── Slow big-MoE tier (Qwen3.8-Flash-Next FP8, 186 GB on NVMe). Batch/overnight only, ~2-4 tok/s. ──
  # Close Unity, Blender and ComfyUI first. Aux models (~3.1 GiB RAM) stay resident.
  "colibri-big":
    name: "Qwen3.8 Flash-Next (colibri, slow, NVMe-streamed)"
    aliases: ["qwen3.8-flash-next"]
    ttl: 600 # unload 10 min after the last request, freeing ~18 GiB RAM
    # coli is a Python launcher (python3 3.14 exists in the image) that spawns /colibri/c/qwen38 (the C engine).
    # It does not hit the network. --ram is the expert-cache budget in GiB (sets RAM_GB), --cap the cache slots per layer.
    cmd: |
      ${gpu_guard} python3 /colibri/c/coli serve
      --model /colibri-models/qwen38-flash-next
      --host 127.0.0.1 --port ${PORT}
      --model-id colibri-big
      --ram 18 --cap 30 --ctx 131072 --kv-slots 1 --ngen 32768 --temp 1.0
      --max-queue 2 --queue-timeout 3600
      --allowed-host '*'
    # Tuning 2026-10-11 (docs/colibri.md "Tuning"): --cap 25 -> 44 = what `coli plan` gives for 18 GB once the
    # dense weights live in VRAM (cap 45 measured 3.39 -> 3.85 tok/s warm, RAM available >= 10 GiB, NVMe swap 0).
    # 2026-10-14 (docs/colibri.md "Capabilities"): capability over speed. --ctx 8192 -> 131072 (KV bank in host RAM,
    # ~54 KiB/token f32, allocated up front: +6.3 GiB), paid for by --cap 44 -> 30 (-3.1 GiB, cap 33 measured -7% tok/s).
    # --ngen 32768: serve default is 8192. --temp 1.0: model's generation_config (server default 0.7; top_k not settable).
    # --allowed-host '*': coli rejects any Host header but localhost, and llama-swap forwards the client's (mars.internal,
    # ollama, an IP). Safe: coli binds 127.0.0.1 in the container, so llama-swap is its only client.
    # --kv-slots stays 1: 4 slots gave only ~+5-11% aggregate and unload the MTP head (-17% single stream).
    # No cmdStop: llama-swap v263 only documents ${PID} for cmdStop; its default SIGTERM is handled by
    # coli serve (stops the engine child). Give the engine time to exit cleanly before a forced kill.
    unloadTimeout: 30
    checkEndpoint: /health # public (no API key needed); returns {"status":"ok"} once the HTTP server is up
    env:
      - COLI_VULKAN=1 # engine was built with VK=1; this switches the GPU on at runtime
      - COLI_VK_DEV=0 # Vulkan0 = RX 7800 XT (Vulkan1 is the 610M iGPU)
      - COLI_NO_OMP_TUNE=1 # no spin-wait; for qwen38 it also skips the physical-core thread count, hence the next line
      - OMP_NUM_THREADS=8 # physical cores; the default 16 (SMT) measured 1.42 tok/s warm, 8 threads 3.39 (same tokens)
      - RAM_GB=18 # same as --ram (used by coli plan; the qwen38 engine itself sizes its cache from --cap)
      - CAP=30 # same as --cap (coli plan with Vulkan gives 44 at --ctx 8192; lowered to fund the 128k KV bank)
      - RSS_GUARD_GB=22 # read by the GLM engine only; no effect on qwen38
      - PYTHONDONTWRITEBYTECODE=1 # /colibri is mounted read-only
      - PYTHONPATH=/colibri/pylib # Pillow + numpy for image input (colibri/pylib.sh); the image has neither
      - COLI_PROGRESS_SECS=15 # local patch colibri/patches/0001-progress-log.patch: [progress] line every 15 s while decoding (0 = off)
      # The model mount is read-write because colibri writes .coli_kv / .coli_usage / .coli_ssd into the model dir.
      # To mount it read-only instead, uncomment these (loses warm KV reopen and usage-based pinning):
      # - KVSAVE=0
      # - USAGE_SAVE=0

routing:
  router:
    use: group
    settings:
      groups:
        chat:
          swap: true      # one member at a time
          exclusive: true # loading a member unloads other (non-persistent) groups
          members:
            - qwen3.8-27b
            - qwen3.6-35b-a3b
            - gemma4-26b
            - granite-vision
            - granite-vision-4.1
            - granite-docling
            - colibri-big # slow NVMe-streamed tier (docs/colibri.md)
        aux:
          persistent: true # never unloaded by the chat group
          swap: false
          exclusive: false
          members:
            - snowflake-arctic-embed2
            - snowflake-arctic-embed2-gpu
            - bge-reranker-v2-m3

hooks:
  on_startup:
    preload:
      - snowflake-arctic-embed2
      - bge-reranker-v2-m3
